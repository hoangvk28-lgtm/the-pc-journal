name: Ping IndexNow on new/updated PC guides

on:
  push:
    branches: [main]
    paths:
      - "data/first-fifty.json"
      - "data/next-hundred.json"

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for deployment to go live
        run: sleep 90

      - name: Submit changed guide URLs to IndexNow
        run: node scripts/indexnow.mjs --auto --since=${{ github.event.before }}
